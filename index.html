<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrahmah Mart - Cloud Realtime Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800">
    <div id="app" class="max-w-4xl mx-auto p-4 min-h-screen flex flex-col justify-between">
        <div>
            <header class="bg-amber-600 text-white p-4 rounded-xl shadow-md mb-4 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold">🛒 Arrahmah Mart Surabaya</h1>
                    <p class="text-xs opacity-90">Belanja Mudah, Hemat & Realtime</p>
                </div>
                <div id="nav-buttons">
                    <button onclick="switchView('customer')" class="bg-white text-amber-700 px-3 py-1.5 rounded-lg text-xs font-semibold shadow">Katalog</button>
                    <button onclick="checkAdminAccess()" class="bg-amber-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow ml-2">Admin</button>
                </div>
            </header>

            <main id="main-content">
                <div class="text-center py-12" id="loading-spinner">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-amber-600 mx-auto mb-3"></div>
                    <p class="text-sm text-slate-500">Memuat Toko Arrahmah Mart...</p>
                </div>
            </main>
        </div>

        <footer class="text-center text-xs text-slate-400 py-6">
            &copy; 2026 Arrahmah Mart Surabaya. All rights reserved.
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://oeoskmyvumfwihbrmfkx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VriQAQ-FC3JGp7-ojoEGHw_YoU5RCDu'; 
        
        let supabaseClient = null;
        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.error("Supabase init warning:", err);
        }

        let products = [];
        let vouchers = [];
        let bundles = [];
        let tebusMurahList = [];
        let customers = [];
        let orders = [];
        let currentView = 'customer';

        async function initApp() {
            try {
                if (supabaseClient) {
                    let pRes = await supabaseClient.from('products').select('*');
                    if (pRes.data) products = pRes.data;

                    let vRes = await supabaseClient.from('vouchers').select('*');
                    if (vRes.data) vouchers = vRes.data;

                    let cRes = await supabaseClient.from('customers').select('*');
                    if (cRes.data) customers = cRes.data;
                }
            } catch (e) {
                console.error("Fetch data warning:", e);
            } finally {
                renderCustomerView();
            }
        }

        function switchView(view) {
            currentView = view;
            if (view === 'customer') renderCustomerView();
            else if (view === 'admin') renderAdminView();
        }

        function renderCustomerView() {
            const main = document.getElementById('main-content');
            let html = `
                <div class="space-y-4">
                    <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-4 rounded-xl shadow">
                        <h2 class="font-bold text-base mb-1">🎁 Promo, Voucher & Tebus Murah</h2>
                        <p class="text-xs opacity-90">Belanja hemat dan nikmati berbagai penawaran spesial hari ini!</p>
                    </div>

                    <h3 class="font-bold text-slate-700 text-sm mt-4">Katalog Produk & Diskon Harga Coret</h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            `;

            if (products.length === 0) {
                html += `
                    <div class="col-span-full bg-white p-6 rounded-xl text-center shadow-sm">
                        <p class="text-xs text-slate-500 mb-2">Belum ada produk atau data sedang dimuat.</p>
                        <button onclick="initApp()" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-xs font-semibold">Muat Ulang Katalog</button>
                    </div>
                `;
            } else {
                products.forEach(p => {
                    let hasDiscount = p.discount && p.discount > 0;
                    let displayPrice = hasDiscount ? p.price - p.discount : p.price;
                    html += `
                        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between">
                            <div>
                                <img src="${p.img || 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=300&q=80'}" class="w-full h-28 object-cover rounded-lg mb-2">
                                <h4 class="font-semibold text-xs text-slate-800 line-clamp-1">${p.name}</h4>
                                ${hasDiscount ? `
                                    <div class="flex items-center gap-2 mt-1">
                                        <span class="text-xs text-slate-400 line-through">Rp ${p.price.toLocaleString()}</span>
                                        <span class="text-xs font-bold text-red-600">Rp ${displayPrice.toLocaleString()}</span>
                                    </div>
                                ` : `
                                    <div class="text-xs font-bold text-amber-700 mt-1">Rp ${p.price.toLocaleString()}</div>
                                `}
                            </div>
                            <button onclick="alert('Fitur keranjang aktif untuk produk: ${p.name}')" class="mt-3 w-full bg-amber-600 text-white py-1.5 rounded-lg text-xs font-medium hover:bg-amber-700">+ Keranjang</button>
                        </div>
                    `;
                });
            }

            html += `</div></div>`;
            main.innerHTML = html;
        }

        function checkAdminAccess() {
            let pin = prompt("Masukkan PIN Admin (Default: 1234):");
            if (pin === "1234") {
                currentView = 'admin';
                renderAdminView();
            } else if (pin !== null) {
                alert("PIN Salah!");
            }
        }

        function renderAdminView() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="bg-white p-4 rounded-xl shadow space-y-6">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h2 class="font-bold text-base text-slate-800">Panel Pengelola Toko (Admin)</h2>
                        <button onclick="switchView('customer')" class="text-xs bg-slate-200 px-3 py-1.5 rounded-lg font-medium">Keluar Admin</button>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <h3 class="font-bold text-xs text-amber-700 uppercase tracking-wide">Tambah Produk & Varian (Hingga 6 Jenis)</h3>
                        <input type="text" id="p-name" placeholder="Nama Produk" class="w-full text-xs p-2 border rounded-lg">
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" id="p-price" placeholder="Harga Normal" class="text-xs p-2 border rounded-lg">
                            <input type="number" id="p-discount" placeholder="Potongan Diskon (Harga Coret)" class="text-xs p-2 border rounded-lg">
                            <input type="number" id="p-stock" placeholder="Stok Utama" class="text-xs p-2 border rounded-lg">
                        </div>
                        <input type="text" id="p-img" placeholder="Link Gambar URL Produk" class="w-full text-xs p-2 border rounded-lg">
                        <input type="text" id="p-variants" placeholder="Varian (Contoh: Merah, Biru / Manis, Asin)" class="w-full text-xs p-2 border rounded-lg">
                        <button onclick="addNewProduct()" class="w-full bg-amber-600 text-white py-2 rounded-lg text-xs font-semibold">Simpan Produk ke Cloud</button>
                    </div>

                    <div>
                        <h3 class="font-bold text-xs text-slate-700 uppercase tracking-wide mb-2">Database Pelanggan & Follow-up WhatsApp</h3>
                        <div class="space-y-2">
                            ${customers.length === 0 ? '<p class="text-xs text-slate-400">Belum ada data pelanggan tersimpan.</p>' : 
                                customers.map(c => `
                                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border text-xs">
                                        <div>
                                            <p class="font-semibold">${c.name || 'Pelanggan'} (${c.phone})</p>
                                            <p class="text-slate-500">Poin: ${c.points || 0}</p>
                                        </div>
                                        <a href="https://wa.me/${c.phone}?text=Halo%20${c.name},%20terima%20kasih%20telah%20berbelanja%20di%20Arrahmah%20Mart." target="_blank" class="bg-green-600 text-white px-3 py-1.5 rounded-lg font-medium hover:bg-green-700">Chat WA</a>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        async function addNewProduct() {
            let name = document.getElementById('p-name').value;
            let price = parseInt(document.getElementById('p-price').value) || 0;
            let discount = parseInt(document.getElementById('p-discount').value) || 0;
            let stock = parseInt(document.getElementById('p-stock').value) || 0;
            let img = document.getElementById('p-img').value;
            let variantsText = document.getElementById('p-variants').value;
            let variants = variantsText ? variantsText.split(',').map(v => v.trim()).slice(0, 6) : [];

            if (!name || !price) {
                alert("Nama dan Harga produk wajib diisi!");
                return;
            }

            let newProd = {
                id: Date.now(),
                name,
                price,
                discount,
                stock,
                img,
                variants
            };

            const { error } = await supabaseClient.from('products').insert([newProd]);
            if (error) {
                alert("Gagal menyimpan produk: " + error.message);
            } else {
                alert("Produk & Varian berhasil disimpan ke Supabase!");
                initApp().then(() => renderAdminView());
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
